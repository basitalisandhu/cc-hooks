[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cc-hooks"
version = "0.1.0"
description = "Typed Python SDK and offline test runner for Claude Code hooks: one dataclass per event, decision builders that print the documented JSON, and a CLI that explains and tests hook settings without running anything destructive."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Muhammad Basit Ali" }]
keywords = [
  "claude-code",
  "claude-code-hooks",
  "hooks",
  "sdk",
  "developer-tools",
  "agent-security",
  "ai-agents",
  "testing",
  "cli",
  "settings",
  "pretooluse",
  "guardrails",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Testing",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
cc-hooks = "cc_hooks.cli:main"

[project.urls]
Homepage = "https://github.com/basitalisandhu/cc-hooks"
Repository = "https://github.com/basitalisandhu/cc-hooks"
Issues = "https://github.com/basitalisandhu/cc-hooks/issues"
Changelog = "https://github.com/basitalisandhu/cc-hooks/blob/main/CHANGELOG.md"
Documentation = "https://github.com/basitalisandhu/cc-hooks/blob/main/docs/events.md"

[tool.hatch.build.targets.wheel]
packages = ["src/cc_hooks"]

[tool.hatch.build.targets.sdist]
include = [
  "src/cc_hooks/**",
  "examples/**",
  "docs/**",
  "tests/**",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
