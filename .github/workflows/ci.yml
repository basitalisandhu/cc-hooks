name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]" build
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Generated files are current
        run: cc-hooks events --markdown | diff - docs/events.md
      - name: Test
        run: python -m pytest -q
      - name: Replay the example fixtures
        run: cc-hooks test examples/fixtures --settings examples/settings.json --cwd .
      - name: Build and smoke-test the wheel
        run: |
          python -m build
          python -m pip install --force-reinstall dist/*.whl
          cc-hooks --version
          cc-hooks events | head -3
          printf '{"session_id":"ci","cwd":".","hook_event_name":"PreToolUse","tool_name":"Bash","tool_input":{"command":"cat .env"}}' > /tmp/event.json
          cc-hooks explain /tmp/event.json --settings examples/settings.json --cwd .
